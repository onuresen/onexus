<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ONEXUS – Relationship Layer</title>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.23.0/cytoscape.min.js"></script>
  <script src="https://unpkg.com/cytoscape-navigator@2.0.2/cytoscape.js-navigator.css"></script>
  <script src="https://unpkg.com/cytoscape-navigator@2.0.2/cytoscape-navigator.js"></script>
  <script src="https://unpkg.com/cytoscape-svg@latest"></script>

  <style>
    :root {
      --bg-main: #ffffff;
      --bg-panel: #f8f9fb;
      --bg-soft: #f3f4f6;
      --bg-canvas: #f5f7fa;

      --text-main: #111827;
      --text-muted: #6b7280;

      --radius: 10px;
      --gap: 12px;

      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: 1fr 320px;
      grid-template-areas:
        "toolbar toolbar"
        "canvas  sidebar"
        "bottom  bottom";
      gap: var(--gap);
      padding: var(--gap);
      background: var(--bg-main);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans JP",
        sans-serif;
      color: var(--text-main);
    }

    /* ---------- Toolbar (single surface) ---------- */
    #toolbar {
      grid-area: toolbar;
      display: flex;
      gap: 20px;
      align-items: center;
      padding: 10px 14px;
      background: var(--bg-panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-group label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      white-space: nowrap;
    }

    select, input[type="file"] {
      font-size: 12px;
      background: transparent;
      border: none;
      color: var(--text-main);
    }

    .badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      background: #111827;
      color: #ffffff;
    }

    /* ---------- Canvas ---------- */
    #canvas-wrap {
      grid-area: canvas;
      position: relative;
      background: var(--bg-canvas);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    #cy {
      position: absolute;
      inset: 0;
    }

    /* ---------- Sidebar (Inspector style) ---------- */
    #sidebar {
      grid-area: sidebar;
      background: var(--bg-panel);
      border-radius: var(--radius);
      padding: 14px;
      overflow-y: auto;
      box-shadow: var(--shadow-sm);
    }

    h3 {
      margin: 14px 0 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    select {
      width: 100%;
    }

    /* Flat buttons */
    button {
      width: 100%;
      padding: 6px 10px;
      margin: 4px 0;
      font-size: 12px;
      background: var(--bg-soft);
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #e5e7eb;
    }

    /* Legend */
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .legend-line {
      width: 18px;
      height: 3px;
      border-radius: 2px;
    }

    /* ---------- Bottom ---------- */
    #bottom {
      grid-area: bottom;
      display: grid;
      grid-template-columns: 320px 1fr 420px;
      gap: var(--gap);
    }

    .card {
      background: var(--bg-panel);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.15s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-md);
    }

    #minimap {
      height: 160px;
      border-radius: 8px;
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    .stack > * {
      margin: 6px 0;
    }

    #details {
      background: #ffffff;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      min-height: 120px;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 1100px) {
      body {
        grid-template-columns: 1fr;
        grid-template-areas:
          "toolbar"
          "canvas"
          "bottom";
      }
      #sidebar {
        display: none;
      }
      #bottom {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- Toolbar -->
  <div id="toolbar">
    <div class="tool-group">
      <label>Language</label>
      <select onchange="setLanguage(this.value)">
        <option value="en">English</option>
        <option value="jp">日本語</option>
      </select>
    </div>

    <div class="tool-group">
      <label>View</label>
      <select onchange="applyLayout(this.value)">
        <option value="default">Free</option>
        <option value="system">System</option>
        <option value="responsibility">Responsibility</option>
        <option value="spatial">Spatial</option>
      </select>
    </div>

    <div class="tool-group">
      <label>Theme</label>
      <select onchange="setTheme(this.value)">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>

    <div class="tool-group">
      <label>Load</label>
      <input type="file" accept=".json" onchange="loadJSON(event)">
    </div>

    <span class="badge">ONEXUS</span>
  </div>

  <!-- Canvas -->
  <div id="canvas-wrap">
    <div id="cy"></div>
  </div>

  <!-- Sidebar -->
  <aside id="sidebar">
    <h3>Filter</h3>
    <select id="categoryFilter" onchange="filterByCategory(this.value)">
      <option value="ALL">All Categories</option>
    </select>

    <h3>Lens</h3>
    <button onclick="filterByDimension('System')">System</button>
    <button onclick="filterByDimension('Spatial')">Spatial</button>
    <button onclick="filterByDimension('Responsibility')">Responsibility</button>
    <button onclick="showAllEdges()">All</button>

    <h3>Legend</h3>
    <div id="legend"></div>
  </aside>

  <!-- Bottom -->
  <div id="bottom">
    <div class="card">
      <h3>Minimap</h3>
      <div id="minimap"></div>
    </div>

    <div class="card stack">
      <h3>Navigation</h3>
      <button onclick="fitView()">Fit</button>
      <button onclick="centerView()">Center</button>
      <button onclick="resetView()">Reset</button>

      <h3>Focus</h3>
      <input type="range" min="1" max="2" value="1"
             oninput="setFocusDepth(this.value)">
      <span id="depthLabel">1-hop</span>
    </div>

    <div class="card">
      <h3>Export</h3>
      <button onclick="exportPNG()">PNG</button>
      <button onclick="exportSVG()">SVG</button>
      <button onclick="exportJSON()">Graph JSON</button>
      <button onclick="exportCSV()">Edges CSV</button>
      <button onclick="exportLayout()">Layout</button>

      <h3>Details</h3>
      <div id="details">Click a node or relationship.</div>
    </div>
  </div>

  <!-- App scripts -->
  <script src="onexus-style.js"></script>
  <script src="onexus-graph.js"></script>

  <script>
    window.addEventListener("resize", () => {
      if (window.cy && typeof window.cy.resize === "function") {
        window.cy.resize();
      }
    });
  </script>
</body>
</html>
