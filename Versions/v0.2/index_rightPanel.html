
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NEXUS – Relationship Layer</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.23.0/cytoscape.min.js"></script>
  <script src="https://unpkg.com/cytoscape-navigator@2.0.2/cytoscape.js-navigator.css"></script>
  <script src="https://unpkg.com/cytoscape-navigator@2.0.2/cytoscape-navigator.js"></script>
  <script src="https://unpkg.com/cytoscape-svg@latest"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 10px;
    }
    #cy {
      width: 72%;
      height: 680px;
      float: left;
      border: 1px solid #ccc;
      background-color: #F5F7FA;
    }
    #controls {
      width: 26%;
      float: right;
      padding: 10px;
      border: 1px solid #ccc;
      background: #f9f9f9;
      box-sizing: border-box;
    }
    button, select {
      width: 100%;
      margin: 4px 0;
    }
    hr {
      margin: 10px 0;
    }
    .badge {
      font-size: 10px;
      background: #333;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      font-size: 11px;
      margin-bottom: 4px;
    }
    .legend-line {
      width: 18px;
      height: 3px;
      margin-right: 6px;
    }
    /* Minimap box styling (optional) */
#minimap {
  width: 100%;
  height: 160px;
  border: 1px solid #ccc;
  background: #fff;
  margin: 6px 0 12px 0;

  position: relative;     /* Fixes floating to page corner */
  overflow: hidden;       /* Prevents minimap from spilling out */
}
  </style>
</head>
<body>
  <h2>
    NEXUS <span class="badge">Relationship Layer</span>
  </h2>

  <div id="cy"></div>

  <div id="controls">
    <h3>Language</h3>
    <select onchange="setLanguage(this.value)">
      <option value="en">English</option>
      <option value="jp">日本語</option>
    </select>

    <h3>View & Theme</h3>
    <select onchange="applyLayout(this.value)">
      <option value="default">Default (Organic)</option>
      <option value="system">System Atlas</option>
      <option value="responsibility">Responsibility Atlas</option>
      <option value="spatial">Spatial Stack</option>
    </select>

    <select onchange="setTheme(this.value)">
      <option value="light">Light Theme</option>
      <option value="dark">Dark Theme</option>
    </select>

    <hr>

    <h3>Load JSON</h3>
    <input type="file" accept=".json" onchange="loadJSON(event)">

    <hr>

    <h3>Node Filter</h3>
    <select id="categoryFilter" onchange="filterByCategory(this.value)">
      <option value="ALL">All Categories</option>
    </select>

    <hr>

    <h3>Relationship Lens</h3>
    <button onclick="filterByDimension('System')">System</button>
    <button onclick="filterByDimension('Spatial')">Spatial</button>
    <button onclick="filterByDimension('Responsibility')">Responsibility</button>
    <button onclick="showAllEdges()">Show All</button>

    <hr>

    <h3>Legend</h3>
    <div id="legend"></div>

    <hr>

    <h3>Navigation</h3>
    <div id="minimap"></div>
    <button onclick="fitView()">Fit to Screen</button>
    <button onclick="centerView()">Center</button>
    <button onclick="resetView()">Reset View</button>

    <hr>

    <h3>Focus Depth</h3>
    <input type="range" min="1" max="2" value="1" step="1" id="depthSlider" oninput="setFocusDepth(this.value)">
    <span id="depthLabel">1-hop</span>

    <hr>

    <h3>Export</h3>
    <button onclick="exportPNG()">Export PNG</button>
    <button onclick="exportSVG()">Export SVG</button>
    <button onclick="exportJSON()">Export JSON (graph)</button>
    <button onclick="exportCSV()">Export CSV (edges)</button>
    <button onclick="exportLayout()">Export Layout (positions)</button>

    <hr>

    <h3>Details</h3>
    <div id="details">Click a node or relationship.</div>
  </div>

  <!-- App scripts -->
  <script src="nexus-style.js"></script>
  <script src="nexus-graph.js"></script>

</body>
</html>
