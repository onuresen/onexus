name: onexus-release

# Fires when an annotated version tag is pushed. Validates that the tag, VERSION,
# and CHANGELOG agree and descend from main, reruns the functional + enterprise
# test gate at the tag, then publishes an immutable archive + SHA-256 checksum as
# a GitHub Release. See docs/RELEASING.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history for ancestry check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate tag / VERSION / CHANGELOG / ancestry
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="v$(tr -d ' \n' < VERSION)"
          echo "Tag=$TAG  VERSION-file=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match VERSION file ($VERSION)"; exit 1
          fi
          PLAIN="${VERSION#v}"
          if ! grep -qE "^## \[${PLAIN}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::No dated '## [${PLAIN}] - YYYY-MM-DD' section in CHANGELOG.md"; exit 1
          fi
          git fetch origin main --depth=0 || git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit is not contained in main"; exit 1
          fi
          echo "Validation OK"

      - name: Install deps
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start server
        run: |
          npx http-server -p 4173 -c-1 . >/tmp/http-server.log 2>&1 &
          echo "Server started"

      - name: Run functional + enterprise test gate
        env:
          BASE_URL: "http://127.0.0.1:4173"
        run: |
          npx playwright test \
            tests/onexus-smoke.spec.js \
            tests/onexus-egress.spec.js \
            tests/onexus-features.spec.js

      - name: Build immutable archive + checksum
        run: |
          set -euo pipefail
          PLAIN="$(tr -d ' \n' < VERSION)"
          NAME="onexus-${PLAIN}"
          tar --exclude='./.git' \
              --exclude='./node_modules' \
              --exclude='./test-results' \
              --exclude='./playwright-report' \
              --exclude="./${NAME}.tar.gz" \
              -czf "${NAME}.tar.gz" .
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          cat "${NAME}.tar.gz.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PLAIN="$(tr -d ' \n' < VERSION)"
          NAME="onexus-${PLAIN}"
          gh release create "${GITHUB_REF_NAME}" \
            "${NAME}.tar.gz" "${NAME}.tar.gz.sha256" \
            --title "ONEXUS ${GITHUB_REF_NAME}" \
            --notes "Automated release. Verify with: sha256sum -c ${NAME}.tar.gz.sha256. See CHANGELOG.md and docs/RELEASING.md."
