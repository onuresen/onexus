<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>ONEXUS – Relationship Layer</title>

  <!-- Libraries -->
  <link rel="stylesheet" href="https://unpkg.com/cytoscape-navigator@2.0.2/cytoscape.js-navigator.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.23.0/cytoscape.min.js"></script>
  <script src="https://unpkg.com/cytoscape-navigator@2.0.2/cytoscape-navigator.js"></script>
  <script src="https://unpkg.com/cytoscape-svg@latest"></script>
  <script src=./src/importers/cobie-importer.js></script>
  <script src=./src/importers/ifc-importer.js></script>

  <style>
    :root {
      --bg-main: #ffffff;
      --bg-panel: #f8f9fb;
      --bg-soft: #f3f4f6;
      --bg-canvas: #f5f7fa;
      --text-main: #111827;
      --text-muted: #6b7280;
      --stroke: #e5e7eb;
      --icon-color: #111827;
      --btn-bg: #ffffff;
      --btn-bg-hover: #eef2ff;

      --radius: 10px;
      --gap: 12px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      /* 2 rows now: toolbar + main; bottom row removed */
      grid-template-rows: auto 1fr;
      grid-template-columns: 1fr 320px;
      grid-template-areas:
        "toolbar toolbar"
        "canvas  sidebar";
      gap: var(--gap);
      padding: var(--gap);
      background: var(--bg-main);
      font-family:
        Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Noto Sans JP", sans-serif;
      color: var(--text-main);
      background: var(--bg-main);
    }

    /* ---- Toolbar (single surface) ---- */
    #toolbar {
      grid-area: toolbar;
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 10px 14px;
      background: var(--bg-panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      color: var(--text-main);
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-group label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      white-space: nowrap;
    }

    select,
    input[type="file"] {
      font-size: 12px;
      background: transparent;
      border: none;
      color: var(--text-main);
    }

    .badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      background: #111827;
      color: #ffffff;
    }

    /* Toolbar icon buttons */
    .iconbar {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      padding: 0;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 7px;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: #eef2ff;
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      color: #111827;
    }

    /* currentColor */
    .divider {
      width: 1px;
      height: 22px;
      background: #e5e7eb;
      margin: 0 6px;
    }

    /* ---- Canvas ---- */
    #canvas-wrap {
      grid-area: canvas;
      position: relative;
      background: var(--bg-canvas);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    #cy {
      position: absolute;
      inset: 0;
    }

    /* Minimap overlay (moved from bottom to canvas corner) */
    #minimap {
      position: absolute;
      bottom: 12px;
      left: 12px;
      width: 240px;
      height: 150px;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--stroke);
      overflow: hidden;
    }

    /* ---- Sidebar (Inspector style) ---- */
    #sidebar {
      grid-area: sidebar;
      background: var(--bg-panel);
      border-radius: var(--radius);
      padding: 14px;
      overflow-y: auto;
      box-shadow: var(--shadow-sm);
    }

    h3 {
      margin: 14px 0 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    select {
      width: 100%;
    }

    /* Flat buttons (kept for lens) */
    button.flat {
      width: 100%;
      padding: 6px 10px;
      margin: 4px 0;
      font-size: 12px;
      background: var(--bg-soft);
      color: var(--text-main);
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button.flat:hover {
      background: #e5e7eb;
    }


    .icon-btn {
      background: var(--btn-bg);
      border: 1px solid var(--stroke);
    }

    .icon-btn:hover {
      background: var(--btn-bg-hover);
    }

    .icon-btn svg {
      color: var(--icon-color);
    }

    /* Legend */
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .legend-line {
      width: 18px;
      height: 3px;
      border-radius: 2px;
    }

    .legend-item.active {
      font-weight: 600;
      color: var(--text-main);
    }

    .legend-item:hover {
      cursor: pointer;
      background: var(--bg-soft);
      border-radius: 4px;
      padding: 2px 4px;
    }

    /* Details panel now in sidebar */
    #details {
      background: #ffffff;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      min-height: 120px;
      color: var(--text-main);
      border: 1px solid var(--stroke);
    }

    /* Responsive */
    @media (max-width: 1100px) {
      body {
        grid-template-columns: 1fr;
        grid-template-areas:
          "toolbar"
          "canvas";
      }

      #sidebar {
        display: none;
      }

      /* Make minimap smaller on narrow screens */
      #minimap {
        width: 180px;
        height: 120px;
        background: var(--bg-panel);
        border: 1px solid var(--stroke);
      }
    }
  </style>

  <!-- Tiny inline SVG sprite for icons -->
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <!-- Fit -->
    <symbol id="i-fit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6" />
    </symbol>
    <!-- Center (crosshair) -->
    <symbol id="i-center" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3" />
      <path d="M12 3v4M12 17v4M21 12h-4M7 12H3" />
    </symbol>
    <!-- Reset (rotate) -->
    <symbol id="i-reset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M20 7V4l-3 3" />
      <path d="M20 7a8 8 0 1 0 2 5" />
    </symbol>
    <!-- PNG (image) -->
    <symbol id="i-png" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
      stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="2" />
      <circle cx="8" cy="10" r="2" />
      <path d="M3 17l5-4 3 3 4-3 6 4" />
    </symbol>
    <!-- SVG (< >) -->
    <symbol id="i-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M8 8l-4 4 4 4M16 8l4 4-4 4" />
    </symbol>
    <!-- JSON ({ }) -->
    <symbol id="i-json" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M8 7c-2 0-3 1-3 5s1 5 3 5" />
      <path d="M16 7c2 0 3 1 3 5s-1 5-3 5" />
    </symbol>
    <!-- CSV (grid) -->
    <symbol id="i-csv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
      stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="2" />
      <path d="M3 11h18M9 5v14M15 5v14" />
    </symbol>
    <!-- Layout (nodes) -->
    <symbol id="i-layout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6" cy="6" r="2.5" />
      <circle cx="18" cy="6" r="2.5" />
      <circle cx="12" cy="18" r="2.5" />
      <path d="M7.8 7.8L10.5 16M16.2 7.8L13.5 16" />
    </symbol>
  </svg>
</head>

<body>
  <!-- Toolbar -->
  <div id="toolbar">
    <div class="tool-group">
      <label>Language</label>
      <select id="languageSelect" onchange="setLanguage(this.value)">
        <option value="en">English</option>
        <option value="jp">日本語</option>
      </select>
    </div>
    <div class="tool-group">
      <label>View</label>
      <select id="layoutSelect" onchange="applyLayout(this.value)">
        <option value="default">Free</option>
        <option value="tree_nested">Tree (Nested)</option>
        <option value="system">System</option>
        <option value="responsibility">Responsibility</option>
        <option value="spatial">Spatial</option>
        <option value="category_lanes">Category Swimlanes</option>
        <option value="degree_rings">Degree Rings</option>
        <option value="dependency_flow">Dependency Flow</option>
        <option value="assembly_chains">Assembly Chains</option>
      </select>
    </div>
    <div class="tool-group">
      <label>Theme</label>
      <select id="themeSelect" onchange="applyTheme(this.value)">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
    <div class="tool-group">
      <label>Load</label>
      <input id="fileInput" type="file" accept=".json,.csv,.ifc" multiple>
    </div>

    <!-- Right aligned compact icons -->
    <div class="iconbar" aria-label="Actions">
      <!-- Navigation -->
      <button class="icon-btn" onclick="fitView()" title="Fit (F)" aria-label="Fit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6" />
        </svg>
      </button>

      <button class="icon-btn" onclick="centerView()" title="Center (C)" aria-label="Center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 3v4M12 17v4M21 12h-4M7 12H3" />
        </svg>
      </button>

      <button class="icon-btn" onclick="resetView()" title="Reset Layout (R)" aria-label="Reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M20 7V4l-3 3" />
          <path d="M20 7a8 8 0 1 0 2 5" />
        </svg>
      </button>

      <span class="divider" aria-hidden="true"></span>

      <!-- Export -->
      <button class="icon-btn" onclick="exportPNG()" title="Export PNG (P)" aria-label="Export PNG">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <circle cx="8" cy="10" r="2" />
          <path d="M3 17l5-4 3 3 4-3 6 4" />
        </svg>
      </button>

      <button class="icon-btn" onclick="exportSVG()" title="Export SVG (V)" aria-label="Export SVG">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M8 8l-4 4 4 4M16 8l4 4-4 4" />
        </svg>
      </button>

      <button class="icon-btn" onclick="exportJSON()" title="Export Graph JSON (J)" aria-label="Export JSON">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M8 7c-2 0-3 1-3 5s1 5 3 5" />
          <path d="M16 7c2 0 3 1 3 5s-1 5-3 5" />
        </svg>
      </button>

      <button class="icon-btn" onclick="exportCSV()" title="Export Edges CSV (S)" aria-label="Export CSV">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M3 11h18M9 5v14M15 5v14" />
        </svg>
      </button>

      <button class="icon-btn" onclick="exportLayout()" title="Export Layout JSON (L)" aria-label="Export Layout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <circle cx="6" cy="6" r="2.5" />
          <circle cx="18" cy="6" r="2.5" />
          <circle cx="12" cy="18" r="2.5" />
          <path d="M7.8 7.8L10.5 16M16.2 7.8L13.5 16" />
        </svg>
      </button>

      <!-- Add this in #toolbar, e.g., after the export icons group -->
      <button class="icon-btn" id="btnCompare" title="Compare (A/B)" aria-label="Compare (A/B)">
        <!-- simple double-square icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="4" width="9" height="9" rx="1.5"></rect>
          <rect x="11" y="11" width="9" height="9" rx="1.5"></rect>
        </svg>
      </button>

      <!-- Hidden file input dedicated to A/B compare -->
      <input id="fileCompareAB" type="file" accept=".json" multiple style="display:none">
    </div>

    <span class="badge">ONEXUS</span>
  </div>

  <!-- Canvas -->
  <div id="canvas-wrap" aria-label="Graph canvas (supports drag & drop)">
    <div id="cy"></div>
    <div id="minimap"></div>
    <div id="drop-hint" style="position:absolute;inset:0;display:none;
        align-items:center;justify-content:center;background:rgba(0,0,0,.04);
        color:#111827;font-weight:600;">
      Drop JSON here
    </div>
  </div>

  <!-- Sidebar (inspector) -->
  <aside id="sidebar">
    <h3>Filter</h3>
    <select id="categoryFilter" onchange="filterByCategory(this.value)">
      <option value="ALL">All Categories</option>
    </select>

    <h3>Focus</h3>
    <div style="display:flex;align-items:center;gap:8px;">
      <input type="range" min="1" max="3" value="1" oninput="setFocusDepth(this.value)" style="flex:1;">
      <span id="depthLabel">1-hop</span>
    </div>

    <h3>Legend</h3>
    <div id="legend"></div>

    <div style="margin-top:6px;font-size:11px;color:var(--text-muted);display:flex;flex-direction:column;gap:2px;">
      <label>
        <input type="checkbox" id="toggleEdgeLabels" checked />
        Show edge labels
      </label>
      <label>
        <input type="checkbox" id="toggleNodeLabels" checked />
        Show node labels
      </label>
    </div>

    <h3>Metrics</h3>
    <div id="metrics">–</div>

    <h3>Details</h3>
    <div id="details">Click a node or relationship.</div>

    <div id="help" style="position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;
            align-items:center;justify-content:center;">
      <div style="background:#fff;padding:16px 20px;border-radius:10px;width:520px;">
        <h3 style="margin-top:0;">Shortcuts</h3>
        <pre style="font-size:12px;white-space:pre-wrap">
        F: Fit   C: Center   R: Reset
        P: PNG   V: SVG      J: JSON   S: CSV   L: Layout JSON
        ?: Toggle this help
        </pre>
        <button class="flat" onclick="this.closest('#help').style.display='none'">Close</button>
      </div>
    </div>

    <h3>Lens</h3>
    <button class="flat" onclick="showAllEdges()">All</button>
    <button class="flat" onclick="filterByDimension('System')">System</button>
    <button class="flat" onclick="filterByDimension('Spatial')">Spatial</button>
    <button class="flat" onclick="filterByDimension('Responsibility')">Responsibility</button>
    <button class="flat" id="lensVendor" onclick="filterByDimension('Vendor')">Vendor</button>

    <h3>Phase</h3>
    <select id="phaseFilter" multiple size="4" style="width:100%"></select>

  </aside>

  <!-- App scripts -->
  <script src=./src/onexus-style.js></script>
  <!-- NEW: split core -->
  <script src=./src/core/graph-core.state.js></script>
  <script src=./src/core/graph-core.layouts.js></script>
  <script src=./src/core/graph-core.filters.js></script>
  <script src=./src/core/graph-core.io.js></script>
  <script src=./src/core/graph-core.context.js></script>
  <script src=./src/core/graph-core.path.js></script>
  <script src=./src/core/graph-core.compare.js></script>
  <!-- UI bindings (unchanged) -->
  <script src=./src/graph-ui.js></script>

  <!-- Resize safety -->
  <script>
    window.addEventListener("resize", () => {
      if (window.cy && typeof window.cy.resize === "function") {
        window.cy.resize();
      }
    });

    // Keyboard shortcuts (F, C, R, P, V, J, S, L)
    document.addEventListener("keydown", (e) => {
      const tag = (e.target || {}).tagName;
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;

      switch ((e.key || "").toLowerCase()) {
        case "f": window.fitView && fitView(); break;
        case "c": window.centerView && centerView(); break;
        case "r": window.resetView && resetView(); break;
        case "p": window.exportPNG && exportPNG(); break;
        case "v": window.exportSVG && exportSVG(); break;
        case "j": window.exportJSON && exportJSON(); break;
        case "s": window.exportCSV && exportCSV(); break;
        case "l": window.exportLayout && exportLayout(); break;
      }
    });
  </script>
</body>

</html>
